<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tux y las letras</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top"></header>
<main>
  <div id="pad"><canvas id="guide" width="600" height="600"></canvas><canvas id="ink" width="600" height="600"></canvas></div>
  <div class="btns"><button id="clear"></button><button id="skip"></button></div>
</main>
<div id="stage"><div id="tux"></div><div id="bubble"></div></div>
<script src="common.js"></script>
<script src="trace.js"></script>
<script>
// BETA: pensado para celular/tablet con dedo o lápiz. No guía el orden ni la dirección del trazo.
// La medición está en trace.js y los umbrales (brush, cover, maxOutside, tolerance) en config.js.
let cur, drawing = false, done = false, ctxG, ctxI, pts = [], mask, near;

function glyph(c) {   // misma tipografía para la guía y la máscara que mide el trazo
  c.font = `900 ${S * .85}px system-ui, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  return [cur, S / 2, S / 2 + S * .04];
}

function layer(grow) {   // alpha de la letra, engrosada 'grow' px por cada lado
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d'), a = glyph(x);
  x.fillText(...a);
  if (grow) { x.lineWidth = grow * 2; x.lineJoin = 'round'; x.strokeText(...a); }
  return x.getImageData(0, 0, S, S).data;
}

const clearInk = () => { ctxI.clearRect(0, 0, S, S); pts = []; };

function next() {
  done = false; cur = shuffle(allKeys())[0];
  clearInk(); ctxG.clearRect(0, 0, S, S);
  const a = glyph(ctxG);
  ctxG.fillStyle = '#e3e6ec'; ctxG.fillText(...a);
  ctxG.setLineDash([10, 14]); ctxG.lineWidth = 3; ctxG.strokeStyle = '#9aa3b2'; ctxG.strokeText(...a);
  mask = layer(0); near = layer(C.trace.tolerance);
  ctxI.lineWidth = strokeWidth(mask) * C.trace.brush;
  ctxI.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue(isLetter(cur) ? '--letter' : '--num');
  document.body.className = isLetter(cur) ? 'letra' : 'numero';
  talk(t('say.traceAsk', { kind: kindOf(cur), name: nameOf(cur) }));
}

function check() {
  const { cov, off } = traceScore(mask, near, ctxI.getImageData(0, 0, S, S).data, pts);
  if (cov >= C.trace.cover && off <= C.trace.maxOutside) return win();
  if (off > C.trace.maxOutside) { clearInk(); talk(t('say.traceKeepGoing')); }   // se fue de la letra: se limpia y se vuelve a empezar
}

async function win() {
  done = true; await talk(t('say.right')); next();
}

const pos = e => { const r = e.target.getBoundingClientRect(); return [(e.clientX - r.left) * S / r.width, (e.clientY - r.top) * S / r.height]; };
// guarda el recorrido con un punto cada ~6 px, para que un trazo rápido no deje huecos al medir
function addPt(x, y) {
  const l = pts[pts.length - 1];
  if (l) { const d = Math.hypot(x - l[0], y - l[1]); for (let s = 6; s < d; s += 6) pts.push([l[0] + (x - l[0]) * s / d, l[1] + (y - l[1]) * s / d]); }
  pts.push([x, y]);
}

(async () => {
  await loadLang(); initPage('trace');
  $('clear').textContent = T.ui.clear; $('skip').textContent = T.ui.skip;
  ctxG = $('guide').getContext('2d'); ctxI = $('ink').getContext('2d');
  ctxI.lineCap = ctxI.lineJoin = 'round';
  $('bubble').textContent = t('say.hello');
  startGate(next);

  const ink = $('ink');
  ink.onpointerdown = e => {
    if (done) return;
    startBreaks(() => !done);
    ink.setPointerCapture(e.pointerId); drawing = true;
    const [x, y] = pos(e); ctxI.beginPath(); ctxI.moveTo(x, y); ctxI.lineTo(x + .01, y); ctxI.stroke(); addPt(x, y);
  };
  ink.onpointermove = e => { if (!drawing) return; const [x, y] = pos(e); ctxI.lineTo(x, y); ctxI.stroke(); addPt(x, y); };
  ink.onpointerup = ink.onpointercancel = () => { if (drawing) { drawing = false; if (!done) check(); } };
  $('clear').onclick = clearInk;
  $('skip').onclick = next;
  if (window.speechSynthesis) speechSynthesis.getVoices();
})();
</script>
</body>
</html>
